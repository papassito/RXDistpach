<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <radialGradient id="boneMat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Background Radiographic Plate -->
  <rect width="500" height="700" fill="#050811"/>

  <!-- Soft tissue outline of forearm, wrist, hand -->
  <path d="M 170,700 C 160,500 170,360 140,230 C 130,170 140,70 180,40 C 220,10 320,10 360,60 C 380,110 380,220 340,360 C 330,500 340,650 345,700 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Radius Bone (Lateral/Thumb side) -->
  <path d="M 190,700 L 195,420 C 195,380 185,345 200,320 C 215,295 255,300 260,335 L 245,420 L 240,700 Z" fill="url(#boneMat)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Ulna Bone (Medial side) -->
  <path d="M 265,700 L 268,430 C 270,390 265,360 280,340 C 295,325 315,335 315,360 L 305,430 L 295,700 Z" fill="url(#boneMat)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Styloid processes -->
  <circle cx="195" cy="318" r="6" fill="#e2e8f0"/>
  <circle cx="316" cy="342" r="5" fill="#e2e8f0"/>

  <!-- Carpal Bones (Proximal & Distal Rows) -->
  <!-- Scaphoid -->
  <path d="M 205,290 C 200,270 215,250 230,260 C 240,270 235,295 220,295 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Lunate -->
  <path d="M 235,285 C 235,265 260,260 265,275 C 265,290 250,295 235,285 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Triquetrum & Pisiform -->
  <ellipse cx="285" cy="280" rx="12" ry="9" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="292" cy="275" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Distal Carpal Row: Trapezium, Trapezoid, Capitate, Hamate -->
  <ellipse cx="205" cy="235" rx="10" ry="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <ellipse cx="225" cy="235" rx="9" ry="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 240,250 C 240,220 265,210 270,230 C 275,255 255,260 240,250 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 275,245 C 275,225 295,220 300,240 C 300,255 285,260 275,245 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Metacarpal Bases (I, II, III, IV, V) -->
  <path d="M 180,210 L 160,110" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <path d="M 215,210 L 205,80" stroke="#cbd5e1" stroke-width="15" stroke-linecap="round"/>
  <path d="M 255,205 L 255,70" stroke="#cbd5e1" stroke-width="16" stroke-linecap="round"/>
  <path d="M 290,210 L 300,90" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
  <path d="M 320,225 L 340,115" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

  <!-- Marker: L (Left Hand/Wrist) -->
  <g transform="translate(420, 40)">
    <rect x="-4" y="-4" width="28" height="32" fill="#020617" stroke="#334155" stroke-width="1.5" rx="3"/>
    <text x="5" y="21" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#f8fafc">L</text>
  </g>

  <!-- Centering crosshair -->
  <g stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
    <line x1="250" y1="280" x2="250" y2="340"/>
    <line x1="220" y1="310" x2="280" y2="310"/>
  </g>
</svg>
