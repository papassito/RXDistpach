<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lungBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0f18"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </radialGradient>
    <radialGradient id="heartGrad" cx="45%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Dark Radiographic Cassette Background -->
  <rect width="600" height="600" fill="#030712"/>

  <!-- Soft tissue mantle -->
  <path d="M 120,600 C 110,350 140,160 250,90 L 350,90 C 460,160 490,350 480,600 Z" fill="#0f172a" opacity="0.75" />

  <!-- Thoracic cavity (lucent lung fields) -->
  <!-- Left Lung Field (anatomical right) -->
  <path d="M 280,140 C 230,150 180,200 170,320 C 160,420 180,480 200,510 C 240,490 270,440 280,390 Z" fill="url(#lungBg)" stroke="#334155" stroke-width="1.5"/>
  <!-- Right Lung Field (anatomical left) -->
  <path d="M 320,140 C 370,150 420,200 430,320 C 440,420 420,480 400,510 C 360,470 330,420 320,380 Z" fill="url(#lungBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Vascular pulmonary markings (bronchovascular tree) -->
  <g stroke="#64748b" stroke-width="1.2" opacity="0.45" stroke-linecap="round">
    <path d="M 270,270 Q 230,280 190,300" />
    <path d="M 270,270 Q 220,330 195,380" />
    <path d="M 265,300 Q 230,360 215,440" />
    <path d="M 330,270 Q 370,280 410,300" />
    <path d="M 330,270 Q 380,330 405,380" />
    <path d="M 335,300 Q 370,360 385,440" />
  </g>

  <!-- Mediastinal & Cardiac silhouette -->
  <path d="M 285,140 C 285,180 275,230 260,280 C 245,330 230,380 270,430 C 310,480 375,470 380,410 C 385,340 330,230 315,140 Z" fill="url(#heartGrad)" filter="url(#softGaze)"/>

  <!-- Trachea (air column) -->
  <rect x="294" y="60" width="12" height="120" rx="3" fill="#020617" opacity="0.9"/>
  <!-- Carina -->
  <path d="M 300,180 L 275,230 M 300,180 L 325,230" stroke="#020617" stroke-width="8" stroke-linecap="round"/>

  <!-- Spine / Dorsal Vertebral Bodies (opaque) -->
  <g fill="#94a3b8" opacity="0.45">
    <rect x="290" y="80" width="20" height="18" rx="2"/>
    <rect x="289" y="105" width="22" height="20" rx="2"/>
    <rect x="288" y="132" width="24" height="22" rx="2"/>
    <rect x="287" y="161" width="26" height="24" rx="2"/>
    <rect x="286" y="192" width="28" height="25" rx="2"/>
    <rect x="285" y="224" width="30" height="26" rx="2"/>
    <rect x="284" y="257" width="32" height="28" rx="2"/>
    <rect x="283" y="292" width="34" height="29" rx="2"/>
    <rect x="282" y="328" width="36" height="30" rx="2"/>
    <rect x="281" y="365" width="38" height="32" rx="2"/>
  </g>

  <!-- Clavicles -->
  <path d="M 300,110 Q 230,105 160,130 Q 140,135 130,125" stroke="#cbd5e1" stroke-width="8" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M 300,110 Q 370,105 440,130 Q 460,135 470,125" stroke="#cbd5e1" stroke-width="8" fill="none" opacity="0.8" stroke-linecap="round"/>

  <!-- Posterior Rib Arches -->
  <g stroke="#cbd5e1" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 285,165 C 220,165 170,195 165,225" />
    <path d="M 315,165 C 380,165 430,195 435,225" />
    <path d="M 285,195 C 210,195 160,230 155,270" />
    <path d="M 315,195 C 390,195 440,230 445,270" />
    <path d="M 285,230 C 200,235 155,275 150,320" />
    <path d="M 315,230 C 400,235 445,275 450,320" />
    <path d="M 285,265 C 190,270 150,320 148,375" />
    <path d="M 315,265 C 410,270 450,320 452,375" />
    <path d="M 285,305 C 185,310 150,370 152,430" />
    <path d="M 315,305 C 415,310 450,370 448,430" />
    <path d="M 285,345 C 190,360 160,420 165,480" />
    <path d="M 315,345 C 410,360 440,420 435,480" />
  </g>

  <!-- Diaphragmatic domes -->
  <path d="M 140,530 Q 220,470 300,510 Q 380,480 460,535 L 460,600 L 140,600 Z" fill="#475569" opacity="0.65"/>

  <!-- Costophrenic sulci -->
  <path d="M 160,490 L 175,525" stroke="#94a3b8" stroke-width="3"/>
  <path d="M 440,490 L 425,525" stroke="#94a3b8" stroke-width="3"/>

  <!-- Radiographic Marker: R (Right) -->
  <g transform="translate(490, 50)">
    <rect x="-4" y="-4" width="28" height="32" fill="#020617" stroke="#334155" stroke-width="1.5" rx="3"/>
    <text x="3" y="21" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#f8fafc">R</text>
  </g>

  <!-- Scale rule lines -->
  <g stroke="#475569" stroke-width="1" opacity="0.6">
    <line x1="20" y1="50" x2="20" y2="150"/>
    <line x1="16" y1="50" x2="24" y2="50"/>
    <line x1="16" y1="100" x2="24" y2="100"/>
    <line x1="16" y1="150" x2="24" y2="150"/>
    <text x="30" y="104" font-family="sans-serif" font-size="10" fill="#94a3b8">10 cm</text>
  </g>
</svg>
